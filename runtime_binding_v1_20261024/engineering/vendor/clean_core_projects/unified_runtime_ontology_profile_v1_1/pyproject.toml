[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-runtime-ontology-profile-v1-1"
version = "0.1.0"
description = "Candidate-only read-only Unified Runtime Ontology Profile V1.1"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unified_runtime_ontology_profile = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
